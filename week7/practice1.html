<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>시계 만들기</title>
    <style>
      #clock {
        font-size: 24px;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>
    <script></script>
  </head>
  <body>
    <h1>div 태그에 시계 만들기</h1>
    <hr />
    <div id="clock"></div>
    <script>
      let timeoutId;

      function updateClock() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        const ampm = hours >= 12 ? "오후" : "오전";
        const displayHours = hours % 12 || 12;
        const timeString = `${ampm} ${displayHours}:${
          minutes < 10 ? "0" : ""
        }${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

        document.getElementById("clock").textContent = timeString;

        timeoutId = setTimeout(updateClock, 1000);
      }
      updateClock();
    </script>
  </body>
</html>
