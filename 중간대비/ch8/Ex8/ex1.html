<!-- getElementId를 이용한 css 변경 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex1</title>
    <script>
      const change = () => {
        const pTag = document.getElementById("pp");
        pTag.style.backgroundColor = "green";
      };
    </script>
  </head>
  <body>
    <h1>css 스타일 동적 변화</h1>
    <hr />
    <p id="pp">이것은 문장입니다</p>
    <input type="button" value="스타일변경" onclick="change()" />
  </body>
</html>
