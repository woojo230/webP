<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      input {
        width: 85px;
        margin: 10px;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const text = document.getElementById("input");
        const put = (data) => {
          text.value += data;
        };
        const result = () => {
          text.value = eval(text.value);
        };
        const back = () => {
          text.value = text.value.substring(0, text.value.length - 1);
        };
        const reset = () => {
          text.value = "";
        };
        document.querySelectorAll("input[type='button']").forEach((button) => {
          button.addEventListener("click", (event) => {
            const value = event.target.value;
            if (value === "=") {
              result();
            } else if (value === "back") {
              back();
            } else if (value === "c" || value === "ce") {
              reset();
            } else {
              put(value);
            }
          });
        });
      });
    </script>
  </head>
  <body>
    <h1>계산기 만들기</h1>
    <hr />
    <input type="text" style="width: 400px" id="input" />
    <br />
    <input type="button" value="back" /><input type="button" value="ce" /><input
      type="button"
      value="c"
    /><input type="button" value="=" />
    <br />
    <input type="button" value="7" /><input type="button" value="8" /><input
      type="button"
      value="9"
    /><input type="button" value="/" />
    <br />
    <input type="button" value="4" /><input type="button" value="5" /><input
      type="button"
      value="6"
    /><input type="button" value="*" />
    <br />
    <input type="button" value="1" /><input type="button" value="2" /><input
      type="button"
      value="3"
    /><input type="button" value="-" />
    <br />
    <input type="button" value="0" /><input type="button" value="+" /><input
      type="button"
      value="none"
    /><input type="button" value="none" />
  </body>
</html>
