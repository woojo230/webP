<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const addAnswer = (obj, answer) => {
        const newP = document.createElement("p");
        newP.innerHTML = answer;
        obj.parentElement.appendChild(newP);
        //화살표 함수와 this 관계 조심.
        newP.addEventListener("click", () => {
          newP.parentElement.removeChild(newP);
        });
      };
    </script>
  </head>
  <body>
    <h1>정답의 동적 삽입</h1>
    <hr />
    <p>
      거울아 거울아 세상에서 누가 제일 예쁘니
      <button onclick="addAnswer(this, '백설공주')">답보기</button>
    </p>
    <p>
      죽느냐 사느냐 그것이 문제로다
      <button onclick="addAnswer(this, '둘다')">답보기</button>
    </p>
  </body>
</html>
