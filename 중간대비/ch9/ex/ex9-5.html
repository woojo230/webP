<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이벤트 객체 전달받기</title>
    <script>
      const f = (e) => {
        alert(e.type);
      };
    </script>
  </head>
  <body>
    <p>마우스를 올려 보세요</p>
    <button onclick="f(event)">클릭</button>
  </body>
</html>
